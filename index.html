<style>
  :root {
    --ink: #ece2cd;
    --ink-dim: #6f6353;
    --bg: #14100c;
    --card: #1e1811;
    --card-edge: #322a1e;
    --swamp: #a3c130;
    --swamp-deep: #5c7a1a;
    --rust: #d08c2e;
    --rust-deep: #8a5a17;
    --row-lit: rgba(163, 193, 48, 0.09);
    --row-tabbed: rgba(208, 140, 46, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(163, 193, 48, 0.07), transparent),
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.25) 2px 4px);
    color: var(--ink);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 18px;
    line-height: 1.4;
    padding: 3rem 1.25rem 4rem;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 3rem; }

  h1 {
    font-family: "Alfa Slab One", "Georgia", serif;
    font-size: clamp(2.6rem, 8vw, 5.2rem);
    line-height: 0.95;
    color: var(--swamp);
    text-shadow: 4px 4px 0 #000, 5px 5px 0 var(--swamp-deep);
    letter-spacing: 0.02em;
    transform: rotate(-1.5deg);
  }

  h1 .sucks { color: var(--rust); }

  .strap {
    margin-top: 1rem;
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .mode-toggle {
    margin: 1.5rem auto 0;
    display: inline-flex;
    border: 1px solid var(--card-edge);
    background: var(--card);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.45);
  }

  .mode-toggle button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-dim);
    font: inherit;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 1rem;
    padding: 0.6rem 1.4rem;
    cursor: pointer;
  }

  .mode-toggle button:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
  .mode-toggle button[aria-pressed="true"].live-btn { background: var(--swamp); color: #14100c; }
  .mode-toggle button[aria-pressed="true"].tabs-btn { background: var(--rust); color: #14100c; }

  .stats {
    margin: 1.25rem auto 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
  }

  .stat {
    border: 1px solid var(--card-edge);
    background: var(--card);
    padding: 0.5rem 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--ink);
  }

  .stat b { font-size: 1.2rem; margin-right: 0.35rem; }
  body[data-mode="live"] .stat b { color: var(--swamp); }
  body[data-mode="tabs"] .stat b { color: var(--rust); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 1.5rem;
    align-items: start;
  }

  .album {
    background: var(--card);
    border: 1px solid var(--card-edge);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
    position: relative;
  }

  body[data-mode="live"] .album.full { border-color: var(--swamp-deep); }

  .ribbon {
    position: absolute;
    top: 14px;
    right: -8px;
    background: var(--swamp);
    color: #14100c;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.8rem;
    padding: 0.25rem 0.7rem;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    transform: rotate(2deg);
    z-index: 2;
  }

  body[data-mode="tabs"] .ribbon { display: none; }

  .album-head { display: flex; gap: 1rem; padding: 1rem 1rem 0.75rem; align-items: center; }

  .cover {
    width: 92px; height: 92px;
    flex: none;
    object-fit: cover;
    border: 2px solid var(--card-edge);
    background: #000;
    filter: saturate(0.9);
  }

  .cover-fallback {
    width: 92px; height: 92px;
    flex: none;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--card-edge);
    background: repeating-linear-gradient(45deg, #221b12 0 8px, #191410 8px 16px);
    font-family: "Alfa Slab One", serif;
    font-size: 2rem;
    color: var(--rust);
  }

  .album-title { font-family: "Alfa Slab One", serif; font-size: 1.25rem; line-height: 1.1; color: var(--ink); }
  .album-year { color: var(--ink-dim); font-weight: 600; letter-spacing: 0.12em; margin-top: 0.2rem; }

  .meter { margin: 0 1rem 0.4rem; }
  .meter-label {
    display: flex; justify-content: space-between;
    font-weight: 700; font-size: 0.95rem;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-dim);
    margin-bottom: 0.3rem;
  }
  body[data-mode="live"] .meter-label .n { color: var(--swamp); }
  body[data-mode="tabs"] .meter-label .n { color: var(--rust); }
  .meter-bar { height: 8px; background: #0d0a07; border: 1px solid var(--card-edge); }
  .meter-fill { height: 100%; }
  body[data-mode="live"] .meter-fill { background: linear-gradient(90deg, var(--swamp-deep), var(--swamp)); }
  body[data-mode="tabs"] .meter-fill { background: linear-gradient(90deg, var(--rust-deep), var(--rust)); }

  .tracks { list-style: none; padding: 0.5rem 0 0.75rem; }

  .track {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.16rem 1rem;
    font-size: 1.05rem;
    color: var(--ink-dim);
  }

  .track.on { color: var(--ink); font-weight: 600; }
  body[data-mode="live"] .track.on { background: var(--row-lit); }
  body[data-mode="tabs"] .track.on { background: var(--row-tabbed); }

  .track .no {
    flex: none; width: 1.4rem;
    text-align: right;
    font-weight: 400;
    color: var(--ink-dim);
    font-size: 0.9rem;
  }
  body[data-mode="live"] .track.on .no { color: var(--swamp-deep); }
  body[data-mode="tabs"] .track.on .no { color: var(--rust-deep); }

  .track .t { flex: 1; }
  .track:not(.on) .t { text-decoration: line-through; text-decoration-color: rgba(111, 99, 83, 0.45); text-decoration-thickness: 1px; }

  .track a { color: var(--rust); text-decoration: none; border-bottom: 1px dotted var(--rust-deep); }
  .track a:hover, .track a:focus-visible { color: var(--ink); border-bottom-color: var(--ink); }

  .tally { flex: none; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.05em; color: var(--swamp); }
  .tally.max { color: var(--rust); }
  body[data-mode="tabs"] .tally { display: none; }

  .gp { flex: none; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.1em; color: var(--rust); text-transform: uppercase; }
  body[data-mode="live"] .gp { display: none; }

  section.others { margin-top: 3rem; }

  .others h2 {
    font-family: "Alfa Slab One", serif;
    font-size: 1.5rem;
    color: var(--rust);
    transform: rotate(-0.5deg);
    margin-bottom: 0.75rem;
  }

  .others ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.6rem; }

  .others li {
    border: 1px dashed var(--card-edge);
    background: var(--card);
    padding: 0.45rem 0.9rem;
    font-weight: 600;
  }

  .others li small { color: var(--ink-dim); font-weight: 400; margin-left: 0.4rem; }
  .others li a { color: var(--rust); text-decoration: none; border-bottom: 1px dotted var(--rust-deep); }
  .others li a:hover, .others li a:focus-visible { color: var(--ink); border-bottom-color: var(--ink); }
  body[data-mode="tabs"] .others { display: none; }

  footer {
    margin-top: 3.5rem;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.95rem;
    letter-spacing: 0.05em;
  }

  footer a { color: var(--swamp); }

  @media (hover: hover) {
    .album { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .album:hover { transform: translate(-2px, -2px); box-shadow: 9px 9px 0 rgba(0,0,0,0.5); }
  }

  @media (prefers-reduced-motion: reduce) {
    .album, .album:hover { transition: none; transform: none; }
  }
</style>
</head>

  const strapEl = document.getElementById("strap");

  function render(mode) {
    document.body.dataset.mode = mode;
    document.getElementById("btn-live").setAttribute("aria-pressed", String(mode === "live"));
    document.getElementById("btn-tabs").setAttribute("aria-pressed", String(mode === "tabs"));
    strapEl.innerHTML = mode === "live"
      ? "Every album track &middot; lit up when I've heard it live"
      : "Every album track &middot; lit up when Ultimate Guitar has a Guitar Pro tab";

    albumsEl.innerHTML = "";
    let onTracks = 0, totalTracks = 0;

    ALBUMS.forEach((album) => {
      const rows = album.tracks.map(([t, n]) => {
        const url = gpUrl(t);
        const on = mode === "live" ? n > 0 : Boolean(url);
        return { t, n, url, on };
      });
      const onCount = rows.filter((r) => r.on).length;
      onTracks += onCount;
      totalTracks += rows.length;

      const card = document.createElement("article");
      card.className = "album" + (album.full ? " full" : "");

      const initials = album.title.split(/\s+/).map((w) => w[0]).slice(0, 2).join("");
      const coverHtml = album.img
        ? `<img class="cover" src="${wikiImg(album.img)}" alt="${esc(album.title)} cover"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
           <div class="cover-fallback" aria-hidden="true">${esc(initials)}</div>`
        : `<div class="cover-fallback" style="display:flex" aria-hidden="true">${esc(initials)}</div>`;

      card.innerHTML = `
        ${album.full ? '<div class="ribbon">Heard in full</div>' : ""}
        <div class="album-head">
          ${coverHtml}
          <div>
            <h2 class="album-title">${esc(album.title)}</h2>
            <div class="album-year">${album.year}</div>
          </div>
        </div>
        <div class="meter">
          <div class="meter-label"><span>${mode === "live" ? "Heard live" : "Pro tabs"}</span><span class="n">${onCount} / ${rows.length}</span></div>
          <div class="meter-bar"><div class="meter-fill" style="width:${(onCount / rows.length) * 100}%"></div></div>
        </div>
        <ol class="tracks">
          ${rows.map((r, i) => {
            const name = mode === "tabs" && r.url
              ? `<a href="${r.url}" target="_blank" rel="noopener">${esc(r.t)}</a>`
              : esc(r.t);
            const badge = mode === "live"
              ? (r.n > 0 ? `<span class="tally${r.n >= 4 ? " max" : ""}" title="heard ${r.n} time${r.n > 1 ? "s" : ""}">&times;${r.n}</span>` : "")
              : (r.url ? '<span class="gp">GP</span>' : "");
            return `
              <li class="track${r.on ? " on" : ""}">
                <span class="no">${i + 1}</span>
                <span class="t">${name}</span>
                ${badge}
              </li>`;
          }).join("")}
        </ol>`;

      albumsEl.appendChild(card);
    });

    statsEl.innerHTML = "";
    const stats = mode === "live"
      ? [[GIGS, "gigs"], [onTracks, `of ${totalTracks} album tracks heard`], [OTHERS.length, "covers & jams"]]
      : [[onTracks, `of ${totalTracks} album tracks with a Guitar Pro tab`]];
    stats.forEach(([n, label]) => {
      const div = document.createElement("div");
      div.className = "stat";
      div.innerHTML = `<b>${n}</b>${label}`;
      statsEl.appendChild(div);
    });
  }

  OTHERS.forEach(([t, src, n]) => {
    const li = document.createElement("li");
    li.innerHTML = `${esc(t)}<small>${esc(src)}${n > 1 ? ` &middot; &times;${n}` : ""}</small>`;
    othersEl.appendChild(li);
  });

  document.getElementById("btn-live").addEventListener("click", () => { location.hash = ""; render("live"); });
  document.getElementById("btn-tabs").addEventListener("click", () => { location.hash = "tabs"; render("tabs"); });

  render(location.hash === "#tabs" ? "tabs" : "live");
</script>
</body>
</html>
